spring:

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:

    consumer:
      group-id: test-group

      auto-offset-reset: earliest

app:

  kafka:
    topic: test-topic

    dlq-topic: test-topic-dlt

    group-id: test-group

management:

  endpoints:
    web:
      exposure:
        include: health